name: Server Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check real server
        run: |
          echo "Runner is working on the real server"
          hostname
          whoami
          pwd
          uptime
          free -h
          df -h

      - name: Check OpenClaw
        run: |
          echo "Checking OpenClaw service"
          systemctl is-active openclaw-gateway.service || true
          systemctl status openclaw-gateway.service --no-pager || true
          ps -eo user,pid,cmd | grep -i openclaw | grep -v grep || true
