name: AWS

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Check real server
        run: |
          echo "Running on real server"
          hostname
          whoami
          pwd
          uptime
          free -h
          df -h

      - name: Check OpenClaw
        run: |
          echo "Checking OpenClaw"
          systemctl is-active openclaw-gateway.service || true
          systemctl status openclaw-gateway.service --no-pager || true
          ps -eo user,pid,cmd | grep -i openclaw | grep -v grep || true
